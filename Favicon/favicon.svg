<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background with subtle shadow effect -->
  <defs>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3DD9C9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" filter="url(#innerShadow)"/>
  <!-- Settings gear icon -->
  <g transform="translate(256, 256)">
    <path d="M 40,-120 L 55,-115 L 70,-95 L 85,-90 L 95,-70 L 115,-55 L 120,-40 L 120,40 L 115,55 L 95,70 L 85,90 L 70,95 L 55,115 L 40,120 L -40,120 L -55,115 L -70,95 L -85,90 L -95,70 L -115,55 L -120,40 L -120,-40 L -115,-55 L -95,-70 L -85,-90 L -70,-95 L -55,-115 L -40,-120 Z" fill="url(#iconGradient)" stroke="#0F172A" stroke-width="3"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#iconGradient)" stroke-width="20"/>
    <circle cx="0" cy="0" r="50" fill="#0F172A"/>
  </g>
  <!-- Subtle highlight for depth -->
  <ellipse cx="256" cy="120" rx="180" ry="60" fill="#1a1f3a" opacity="0.3"/>
</svg>
